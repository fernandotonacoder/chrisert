name: Sync Main → Dev

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: sync-main-to-dev
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          app-id: ${{ secrets.SYNC_BOT_APP_ID }}
          private-key: ${{ secrets.SYNC_BOT_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "chrisert-sync-bot[bot]"
          git config user.email "chrisert-sync-bot[bot]@users.noreply.github.com"

      - name: Sync main to dev
        run: |
          git fetch origin dev
          git checkout dev

          # Check if dev and main have diverged with conflicts
          if git rebase origin/main; then
            echo "Rebase successful"
          else
            echo "::error::Rebase of dev onto main hit conflicts - resolve manually (dev left untouched)."
            git rebase --abort
            exit 1
          fi

          # Create empty commit to mark sync completion
          git commit --allow-empty -m "chore: sync from main"

          git push origin dev --force-with-lease
