name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate target branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "dev" ] && [ "$REF_NAME" != "main" ]; then
            echo "::error::Deploy runs only from 'dev' (-> GitHub Pages) or 'main' (-> Netlify); got '$REF_NAME'."
            exit 1
          fi

  call-test:
    needs: [guard]
    permissions:
      contents: read
    uses: ./.github/workflows/build-and-test.yml
    with:
      upload-dist: ${{ github.ref_name == 'main' }}

  call-lint:
    needs: [guard]
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yml

  call-audit:
    needs: [guard]
    permissions:
      contents: read
    uses: ./.github/workflows/security-audit.yml

  # main → Netlify (production)
  netlify:
    if: github.ref_name == 'main'
    needs: [call-test, call-lint, call-audit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: netlify
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Download dist artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Cache Netlify CLI
        uses: actions/cache@v6.1.0
        with:
          path: ~/.npm/_npx
          key: npx-netlify-cli-27.1.2-${{ runner.os }}

      - name: Deploy to Netlify
        run: npx --ignore-scripts netlify-cli@27.1.2 deploy --dir=dist --prod
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  # dev → GitHub Pages (staging)
  pages-build:
    if: github.ref_name == 'dev'
    needs: [call-test, call-lint, call-audit]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build
        uses: ./.github/actions/build
        with:
          deploy-target: github-pages

      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./dist

  pages-deploy:
    if: github.ref_name == 'dev'
    needs: [pages-build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.0
