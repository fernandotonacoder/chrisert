name: Build and Test

on:
  pull_request:
    branches:
      - main
      - dev
  workflow_call:
    inputs:
      upload-dist:
        description: "Upload dist/ as the 'dist' artifact so the caller can deploy it. The build here runs without DEPLOY_TARGET, i.e. Vite base '/' (Netlify)."
        required: false
        type: boolean
        default: false

jobs:
  changes:
    permissions:
      contents: read
    uses: ./.github/workflows/_detect-code-changes.yml

  build-and-test:
    name: Build and Test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Verify build
        run: npm run build

      - name: Upload dist artifact
        if: ${{ inputs.upload-dist }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7
