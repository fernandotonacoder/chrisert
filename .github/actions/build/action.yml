name: Build site
description: Install dependencies and build the production bundle.

inputs:
  deploy-target:
    description: "Set to 'github-pages' to build with the /chrisert/ base path; leave empty for the root domain (Netlify)."
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v7.0.0
      with:
        node-version-file: ".nvmrc"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci --ignore-scripts

    - name: Build
      shell: bash
      run: npm run build
      env:
        DEPLOY_TARGET: ${{ inputs.deploy-target }}
