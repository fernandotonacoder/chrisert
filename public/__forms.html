<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form
      name="contacto"
      data-netlify="true"
      netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contacto" />
      <label for="netlify-bot-field">Não preencher</label>
      <input id="netlify-bot-field" name="bot-field" />
      <label for="netlify-nome">Nome</label>
      <input id="netlify-nome" type="text" name="nome" />
      <label for="netlify-email">Email</label>
      <input id="netlify-email" type="email" name="email" />
      <label for="netlify-telefone">Telefone</label>
      <input id="netlify-telefone" type="tel" name="telefone" />
      <label for="netlify-assunto">Assunto</label>
      <input id="netlify-assunto" type="text" name="assunto" />
      <label for="netlify-mensagem">Mensagem</label>
      <textarea id="netlify-mensagem" name="mensagem"></textarea>
    </form>
  </body>
</html>
